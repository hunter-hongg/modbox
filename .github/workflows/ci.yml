name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel superseded runs of the same ref to keep CI queue small.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Format check — clang-format over every C++ source and header.
  # ------------------------------------------------------------------
  format:
    name: Clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: |
          set -euo pipefail
          files=$(find src include -type f \( -name '*.cpp' -o -name '*.hpp' \) | LC_ALL=C sort)
          unformatted=$(echo "$files" | xargs clang-format --dry-run --Werror -n)
          if [ -n "$unformatted" ]; then
            echo "The following files are not clang-format clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "All files formatted."

  # ------------------------------------------------------------------
  # 2. Build + test — the canonical job.
  # ------------------------------------------------------------------
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config \
            libssl-dev libselinux1-dev libacl1-dev \
            zlib1g-dev liblzma-dev libzstd-dev \
            libbz2-dev libelf-dev libdw-dev \
            binutils-dev libminizip-dev \
            python3 cmake

      - name: Build ftxui from source (not in Ubuntu repos)
        run: |
          set -euo pipefail
          cd /tmp
          git clone --depth 1 --branch v7.0.3 https://github.com/ArthurSonzogni/FTXUI.git
          cd FTXUI
          cmake -B build -S . \
            -DBUILD_SHARED_LIBS=ON \
            -DFTXUI_BUILD_DOCS=OFF \
            -DFTXUI_BUILD_EXAMPLES=OFF \
            -DFTXUI_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build -j$(nproc)
          sudo cmake --install build

      - name: Create missing pkg-config files (bzip2, bfd)
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkgconfig
          # bzip2.pc — Ubuntu's libbz2-dev doesn't ship one
          printf 'prefix=/usr\nexec_prefix=${prefix}\nlibdir=${exec_prefix}/lib/x86_64-linux-gnu\nincludedir=${prefix}/include\n\nName: bzip2\nDescription: bzip2 compression library\nVersion: 1.0.8\nLibs: -L${libdir} -lbz2\nCflags: -I${includedir}\n' > /tmp/pkgconfig/bzip2.pc
          # bfd.pc — Ubuntu's binutils-dev doesn't ship one
          printf 'prefix=/usr\nexec_prefix=${prefix}\nlibdir=${exec_prefix}/lib/x86_64-linux-gnu\nincludedir=${prefix}/include\n\nName: bfd\nDescription: BFD library\nVersion: 2.42\nLibs: -L${libdir} -lbfd\nCflags: -I${includedir}\n' > /tmp/pkgconfig/bfd.pc
          export PKG_CONFIG_PATH="/tmp/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build (make compile)
        run: |
          set -euo pipefail
          make clean || true
          make compile

      - name: Regenerate registry files
        run: |
          set -euo pipefail
          make regen

      - name: Smoke run
        run: |
          set -euo pipefail
          ./target/modbox --help || true

      - name: Run tests
        run: |
          set -euo pipefail
          make test

      - name: Upload test results (logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/*.log
            build-debug/**

  # ------------------------------------------------------------------
  # 3. Static analysis — clang-tidy over all sources.
  # ------------------------------------------------------------------
  lint:
    name: Clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config \
            libssl-dev libselinux1-dev libacl1-dev \
            zlib1g-dev liblzma-dev libzstd-dev \
            libbz2-dev libelf-dev libdw-dev \
            binutils-dev libminizip-dev \
            clang-tidy cmake

      - name: Build ftxui from source (not in Ubuntu repos)
        run: |
          set -euo pipefail
          cd /tmp
          git clone --depth 1 --branch v7.0.3 https://github.com/ArthurSonzogni/FTXUI.git
          cd FTXUI
          cmake -B build -S . \
            -DBUILD_SHARED_LIBS=ON \
            -DFTXUI_BUILD_DOCS=OFF \
            -DFTXUI_BUILD_EXAMPLES=OFF \
            -DFTXUI_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build -j$(nproc)
          sudo cmake --install build

      - name: Create missing pkg-config files (bzip2, bfd)
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkgconfig
          printf 'prefix=/usr\nexec_prefix=${prefix}\nlibdir=${exec_prefix}/lib/x86_64-linux-gnu\nincludedir=${prefix}/include\n\nName: bzip2\nDescription: bzip2 compression library\nVersion: 1.0.8\nLibs: -L${libdir} -lbz2\nCflags: -I${includedir}\n' > /tmp/pkgconfig/bzip2.pc
          printf 'prefix=/usr\nexec_prefix=${prefix}\nlibdir=${exec_prefix}/lib/x86_64-linux-gnu\nincludedir=${prefix}/include\n\nName: bfd\nDescription: BFD library\nVersion: 2.42\nLibs: -L${libdir} -lbfd\nCflags: -I${includedir}\n' > /tmp/pkgconfig/bfd.pc
          export PKG_CONFIG_PATH="/tmp/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Generate compile_commands.json
        run: |
          set -euo pipefail
          make compile_commands.json

      - name: Run clang-tidy
        run: |
          set -euo pipefail
          make lint

      - name: Upload lint output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: |
            .clang-tidy-cache/**
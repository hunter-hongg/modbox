name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel superseded runs of the same ref to keep CI queue small.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Format check — clang-format over every C++ source and header.
  # ------------------------------------------------------------------
  format:
    name: Clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: |
          set -euo pipefail
          files=$(find src include -type f \( -name '*.cpp' -o -name '*.hpp' \) | LC_ALL=C sort)
          unformatted=$(echo "$files" | xargs clang-format --dry-run --Werror -n)
          if [ -n "$unformatted" ]; then
            echo "The following files are not clang-format clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "All files formatted."

  # ------------------------------------------------------------------
  # 2. Build + test — the canonical job.
  # ------------------------------------------------------------------
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config \
            libssl-dev libselinux1-dev \
            python3

      - name: Verify vendored pkg-config deps
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/.brew/Homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          for p in ftxui openssl libselinux libacl zlib liblzma libzstd minizip bzip2 libdw libelf bfd; do
            pkg-config --exists "$p" || { echo "ERROR: pkg-config cannot find '$p'"; exit 1; }
          done
          echo "All pkg-config dependencies resolve."

      - name: Build (make compile)
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/.brew/Homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$PWD/.brew/Homebrew/lib:${LD_LIBRARY_PATH:-}"
          make clean || true
          make compile

      - name: Smoke run
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/.brew/Homebrew/lib:${LD_LIBRARY_PATH:-}"
          ./target/modbox --help || true

      - name: Run tests
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/.brew/Homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$PWD/.brew/Homebrew/lib:${LD_LIBRARY_PATH:-}"
          make test

      - name: Upload test results (logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/*.log
            build-debug/**

  # ------------------------------------------------------------------
  # 3. Static analysis — clang-tidy over all sources.
  # ------------------------------------------------------------------
  lint:
    name: Clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config \
            libssl-dev libselinux1-dev \
            clang-tidy

      - name: Verify vendored pkg-config deps
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/.brew/Homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          for p in ftxui openssl libselinux libacl zlib liblzma libzstd minizip bzip2 libdw libelf bfd; do
            pkg-config --exists "$p" || { echo "ERROR: pkg-config cannot find '$p'"; exit 1; }
          done
          echo "All pkg-config dependencies resolve."

      - name: Generate compile_commands.json
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/.brew/Homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          make compile_commands.json

      - name: Run clang-tidy
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/.brew/Homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          make lint

      - name: Upload lint output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: |
            .clang-tidy-cache/**
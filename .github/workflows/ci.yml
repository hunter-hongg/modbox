name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake git pkg-config curl ca-certificates libssl-dev 
          # optional helpers that may be used by the project
          sudo apt-get install -y python3 python3-pip

      - name: Build (make compile)
        run: |
          set -euo pipefail
          make clean || true
          make compile

      - name: Run tests
        run: |
          set -euo pipefail
          bash tests/run_tests.sh

      - name: Upload test results (logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/*.log
            build-debug/**
